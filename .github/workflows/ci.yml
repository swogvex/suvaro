name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, lint, test, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint and format
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build (Node adapter)
        run: pnpm build:node

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: pnpm e2e

      - name: Lighthouse CI
        run: pnpm lhci

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
