allowBuilds:
  esbuild: true
  sharp: false

# Security overrides for build-time transitive dependencies of @astrojs/vercel (see docs/ai/00-memory.md).
# Remove each one when the parent package ships the patched version.
minimumReleaseAgeExclude:
  - astro@7.4.8

overrides:
  '@vercel/routing-utils>path-to-regexp': ^6.3.0
  '@vercel/nft>glob': ^14.0.2
  minimatch@>=7 <11.0.1: ^11.0.1
  # GHSA-67mh-4wv8-2f99: drizzle-kit's legacy loader (@esbuild-kit/core-utils, unmaintained) pins esbuild 0.18.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # Compatibility: keep the emnapi runtime on the same release line as @emnapi/core (a 2.0 beta breaks astro check).
  '@emnapi/runtime': 1.11.3

# GHSA-gcqx-w48m-w2h4 (deepmerge, low, no patched release): used only by @sveltejs/vite-plugin-svelte
# at build time to merge our own Svelte config; never bundled into the server or client. Remove when a fix ships.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
