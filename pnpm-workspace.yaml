allowBuilds:
  esbuild: true
  sharp: false

# Security overrides for build-time transitive dependencies of @astrojs/vercel (see docs/ai/00-memory.md).
# Remove each one when the parent package ships the patched version.
minimumReleaseAgeExclude:
  - astro@7.4.8

overrides:
  '@vercel/routing-utils>path-to-regexp': ^6.3.0
  '@vercel/nft>glob': ^14.0.2
  minimatch@>=7 <11.0.1: ^11.0.1
  # Compatibility: keep the emnapi runtime on the same release line as @emnapi/core (a 2.0 beta breaks astro check).
  '@emnapi/runtime': 1.11.3
